version: '3'
services:  
  indoarsipdb:
    image: bitnami/postgresql:latest
    container_name: indoarsip-db
    environment:
      - POSTGRESQL_USERNAME=indoarsipapi
      - POSTGRESQL_PASSWORD=indoarsipapi
      - POSTGRESQL_DATABASE=indoarsip
    ports:
      - '5432:5432'
    volumes:
      - ../psql:/bitnami/postgresql

  indoarsipapi:
    container_name: indoarsip-api
    restart: unless-stopped
    depends_on:
      - indoarsipdb
    build:
      context: ./
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules
